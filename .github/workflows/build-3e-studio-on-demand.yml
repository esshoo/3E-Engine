name: Build 3E Host (On Demand)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch / tag / commit to build
        required: true
        default: feature/studio-host
        type: string
      configuration:
        description: Build configuration
        required: true
        default: Debug
        type: choice
        options:
          - Debug
          - Release

permissions:
  contents: read

jobs:
  build-host:
    name: 3E Host ${{ inputs.configuration }} x64
    runs-on: windows-2025-vs2026

    steps:
      - name: Checkout requested ref
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Show runner/toolchain info
        shell: pwsh
        run: |
          Write-Host "OS: $([System.Environment]::OSVersion.VersionString)"
          Write-Host "Workspace: $env:GITHUB_WORKSPACE"

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"

          if (-not (Test-Path $vswhere)) {
            throw "vswhere.exe not found on runner."
          }

          & $vswhere -latest -products * -property displayName
          & $vswhere -latest -products * -property catalog_productDisplayVersion

      - name: Download Premake 5.0.0-beta8
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $url = "https://github.com/premake/premake-core/releases/download/v5.0.0-beta8/premake-5.0.0-beta8-windows.zip"
          $expected = "e64ce2ed8778e0098f63674cca61fe33941b5f0c8d9a4afd651152bdea3758ab"

          New-Item -ItemType Directory -Force -Path ".tools\premake" | Out-Null

          Invoke-WebRequest `
            -Uri $url `
            -OutFile ".tools\premake.zip"

          $actual = (Get-FileHash ".tools\premake.zip" -Algorithm SHA256).Hash.ToLowerInvariant()

          if ($actual -ne $expected) {
            throw "Premake SHA256 mismatch. Expected $expected, got $actual"
          }

          Expand-Archive `
            -Path ".tools\premake.zip" `
            -DestinationPath ".tools\premake" `
            -Force

          $premake = Get-ChildItem ".tools\premake" -Recurse -Filter "premake5.exe" |
            Select-Object -First 1

          if (-not $premake) {
            throw "premake5.exe not found after extraction."
          }

          Copy-Item $premake.FullName ".tools\premake5.exe" -Force

          & ".\.tools\premake5.exe" --version

      - name: Generate Visual Studio 2026 projects
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          & ".\.tools\premake5.exe" vs2026

          if ($LASTEXITCODE -ne 0) {
            throw "Premake generation failed with exit code $LASTEXITCODE."
          }

          foreach ($project in @(
            ".\build\3E-Studio.vcxproj",
            ".\build\3E-Player.vcxproj"
          )) {
            if (-not (Test-Path $project)) {
              throw "Premake did not generate: $project"
            }
          }

      - name: Locate MSBuild
        id: msbuild
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"

          $matches = @(
            & $vswhere `
              -latest `
              -products * `
              -requires Microsoft.Component.MSBuild `
              -find "MSBuild\**\MSBuild.exe"
          ) | Where-Object {
            $_ -and
            (Test-Path $_) -and
            ($_ -notmatch '\\Roslyn\\') -and
            ($_ -notmatch '\\FileTracker\\')
          }

          if ($matches.Count -eq 0) {
            throw "MSBuild.exe not found."
          }

          $msbuild = $matches |
            Sort-Object {
              if ($_ -match '\\amd64\\') { 0 } else { 1 }
            }, Length |
            Select-Object -First 1

          Write-Host "MSBuild: $msbuild"
          "path=$msbuild" >> $env:GITHUB_OUTPUT

      - name: Build 3E-Studio
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          & "${{ steps.msbuild.outputs.path }}" `
            ".\build\3E-Studio.vcxproj" `
            /m `
            /nologo `
            /p:Configuration="${{ inputs.configuration }}" `
            /p:Platform=x64

          if ($LASTEXITCODE -ne 0) {
            throw "3E-Studio build failed with exit code $LASTEXITCODE."
          }

      - name: Build 3E-Player
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          & "${{ steps.msbuild.outputs.path }}" `
            ".\build\3E-Player.vcxproj" `
            /m `
            /nologo `
            /p:Configuration="${{ inputs.configuration }}" `
            /p:Platform=x64

          if ($LASTEXITCODE -ne 0) {
            throw "3E-Player build failed with exit code $LASTEXITCODE."
          }

      - name: Verify built host and data definitions
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          foreach ($path in @(
            ".\bin\3E-Studio.exe",
            ".\bin\3E-Player.exe",
            ".\config\studio.json",
            ".\config\ui\default\studio.json",
            ".\games\jackie\game.json"
          )) {
            if (-not (Test-Path $path)) {
              throw "Missing required host file: $path"
            }
          }

          Get-Content ".\config\studio.json" -Raw | ConvertFrom-Json | Out-Null
          Get-Content ".\games\jackie\game.json" -Raw | ConvertFrom-Json | Out-Null

      - name: Verify universal 3E-Player runtime bootstrap
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Push-Location $env:GITHUB_WORKSPACE

          try {
            & ".\bin\3E-Player.exe" `
              --game jackie `
              --verify-runtime

            if ($LASTEXITCODE -ne 0) {
              if (Test-Path ".\3E-Player-Verify.txt") {
                Get-Content ".\3E-Player-Verify.txt"
              }

              throw "3E-Player runtime verification failed with exit code $LASTEXITCODE."
            }

            if (-not (Test-Path ".\3E-Player-Verify.txt")) {
              throw "3E-Player verification report was not produced."
            }

            Get-Content ".\3E-Player-Verify.txt"
          }
          finally {
            Pop-Location
          }

      - name: Prepare portable Studio + Player artifact
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          & ".\scripts\package-3e-host.ps1" `
            -Root $env:GITHUB_WORKSPACE `
            -Output ".artifact\3E-Studio"

          if ($LASTEXITCODE -ne 0) {
            throw "Host packaging script failed with exit code $LASTEXITCODE."
          }

          if (Test-Path ".\3E-Player-Verify.txt") {
            Copy-Item `
              ".\3E-Player-Verify.txt" `
              ".\.artifact\3E-Studio\3E-Player-Verify.txt" `
              -Force
          }

          @"

          GitHub Actions build metadata

          Source ref:
            ${{ inputs.ref }}

          Source commit:
            $env:GITHUB_SHA

          Configuration:
            ${{ inputs.configuration }} x64

          Native hosts:
            3E-Studio.exe
            3E-Player.exe

          Daily workflow:
            Edit JSON / schemas / Lua scripts -> no host rebuild.
          "@ | Add-Content ".\.artifact\3E-Studio\BUILD-INFO.txt" -Encoding UTF8

          foreach ($path in @(
            ".\.artifact\3E-Studio\3E-Studio.exe",
            ".\.artifact\3E-Studio\3E-Player.exe",
            ".\.artifact\3E-Studio\config",
            ".\.artifact\3E-Studio\games"
          )) {
            if (-not (Test-Path $path)) {
              throw "Portable artifact is incomplete: $path"
            }
          }

      - name: Upload 3E host artifact
        uses: actions/upload-artifact@v4
        with:
          name: 3E-Studio-${{ inputs.configuration }}-x64
          path: .artifact/3E-Studio
          if-no-files-found: error
          retention-days: 30