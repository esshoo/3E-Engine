name: 3EChan - Upstream Watch

on:
  schedule:
    # Check once every hour.
    # Minute 17 avoids GitHub Actions congestion around :00.
    - cron: "17 * * * *"

  workflow_dispatch:
    inputs:
      force_alert:
        description: "Force an alert for testing"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  issues: write

concurrency:
  group: 3echan-upstream-watch
  cancel-in-progress: true

jobs:
  check-upstream:
    name: Check SilverwireGames/ReChan
    runs-on: ubuntu-latest

    env:
      GH_TOKEN: ${{ github.token }}
      UPSTREAM_REPO: SilverwireGames/ReChan
      FORK_REPO: ${{ github.repository }}

    steps:
      - name: Checkout 3EChan
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch upstream
        shell: bash
        run: |
          set -euo pipefail

          git remote remove upstream 2>/dev/null || true
          git remote add upstream https://github.com/SilverwireGames/ReChan.git
          git fetch upstream main --prune

      - name: Compare fork with upstream
        id: compare
        shell: bash
        env:
          FORCE_ALERT: ${{ github.event_name == 'workflow_dispatch' && inputs.force_alert || false }}
        run: |
          set -euo pipefail

          FORK_SHA="$(git rev-parse HEAD)"
          UPSTREAM_SHA="$(git rev-parse upstream/main)"
          UPDATE_COUNT="$(git rev-list --count HEAD..upstream/main)"

          UPDATE_AVAILABLE=false

          if [ "$UPDATE_COUNT" -gt 0 ]; then
            UPDATE_AVAILABLE=true
          fi

          if [ "$FORCE_ALERT" = "true" ]; then
            UPDATE_AVAILABLE=true
          fi

          echo "fork_sha=$FORK_SHA" >> "$GITHUB_OUTPUT"
          echo "upstream_sha=$UPSTREAM_SHA" >> "$GITHUB_OUTPUT"
          echo "update_count=$UPDATE_COUNT" >> "$GITHUB_OUTPUT"
          echo "update_available=$UPDATE_AVAILABLE" >> "$GITHUB_OUTPUT"
          echo "force_alert=$FORCE_ALERT" >> "$GITHUB_OUTPUT"

          echo "Fork HEAD:     $FORK_SHA"
          echo "Upstream HEAD: $UPSTREAM_SHA"
          echo "New commits:   $UPDATE_COUNT"
          echo "Alert:         $UPDATE_AVAILABLE"

      - name: Build update report
        if: steps.compare.outputs.update_available == 'true'
        shell: bash
        env:
          FORK_SHA: ${{ steps.compare.outputs.fork_sha }}
          UPSTREAM_SHA: ${{ steps.compare.outputs.upstream_sha }}
          UPDATE_COUNT: ${{ steps.compare.outputs.update_count }}
          FORCE_ALERT: ${{ steps.compare.outputs.force_alert }}
        run: |
          set -euo pipefail

          if [ "$UPDATE_COUNT" -gt 0 ]; then
            git log \
              --max-count=20 \
              --pretty=format:'- [`%h`](https://github.com/SilverwireGames/ReChan/commit/%H) %s' \
              HEAD..upstream/main > /tmp/upstream-commits.md
          else
            echo "- No real upstream commits are pending. This alert was generated by Test Mode." > /tmp/upstream-commits.md
          fi

          {
            echo "# 🔔 ReChan upstream update detected"
            echo
            echo "The original **SilverwireGames/ReChan** repository contains changes that are not yet present in \`3EChan/main\`."
            echo

            if [ "$FORCE_ALERT" = "true" ]; then
              echo "> ⚠️ **TEST MODE:** This alert was forced manually to verify the notification system."
              echo
            fi

            echo "## Status"
            echo
            echo "- Fork: \`esshoo/3EChan\`"
            echo "- Upstream: \`SilverwireGames/ReChan\`"
            echo "- Fork HEAD: \`$FORK_SHA\`"
            echo "- Upstream HEAD: \`$UPSTREAM_SHA\`"
            echo "- New upstream commits: **$UPDATE_COUNT**"
            echo
            echo "## Upstream commits"
            echo
            cat /tmp/upstream-commits.md
            echo
            echo
            echo "## Review before syncing"
            echo
            echo "Do **not** automatically merge these updates."
            echo
            echo "Review them first, especially for conflicts with:"
            echo
            echo "- Arabic localization"
            echo "- Text rendering"
            echo "- Fonts"
            echo "- UI"
            echo "- Input"
            echo "- Save/load"
            echo "- Any modified 3EChan systems"
            echo
            echo "Upstream commits:"
            echo "https://github.com/SilverwireGames/ReChan/commits/main"
            echo
            echo "---"
            echo
            echo "This issue is maintained automatically by \`3EChan - Upstream Watch\`."
          } > /tmp/upstream-issue.md

      - name: Create or update upstream alert
        if: steps.compare.outputs.update_available == 'true'
        shell: bash
        run: |
          set -euo pipefail

          gh label create upstream-update \
            --repo "$FORK_REPO" \
            --color "FBCA04" \
            --description "Updates are available from SilverwireGames/ReChan" \
            --force

          ISSUE_NUMBER="$(
            gh issue list \
              --repo "$FORK_REPO" \
              --state open \
              --label upstream-update \
              --limit 1 \
              --json number \
              --jq '.[0].number // empty'
          )"

          if [ -n "$ISSUE_NUMBER" ]; then
            echo "Updating existing issue #$ISSUE_NUMBER"

            gh issue edit "$ISSUE_NUMBER" \
              --repo "$FORK_REPO" \
              --title "🔔 Upstream ReChan update available" \
              --body-file /tmp/upstream-issue.md
          else
            echo "Creating upstream update issue"

            gh issue create \
              --repo "$FORK_REPO" \
              --title "🔔 Upstream ReChan update available" \
              --body-file /tmp/upstream-issue.md \
              --label upstream-update
          fi

      - name: Close resolved upstream alert
        if: steps.compare.outputs.update_available != 'true'
        shell: bash
        run: |
          set -euo pipefail

          ISSUE_NUMBER="$(
            gh issue list \
              --repo "$FORK_REPO" \
              --state open \
              --label upstream-update \
              --limit 1 \
              --json number \
              --jq '.[0].number // empty'
          )"

          if [ -n "$ISSUE_NUMBER" ]; then
            gh issue comment "$ISSUE_NUMBER" \
              --repo "$FORK_REPO" \
              --body "✅ \`3EChan/main\` now contains all currently detected upstream commits."

            gh issue close "$ISSUE_NUMBER" \
              --repo "$FORK_REPO"
          else
            echo "No open upstream alert."
          fi